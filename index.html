<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake and Ladders</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <h1>🐍 Snake and Ladders</h1>
        <div class="layout">
            <div class="side">
                <p class="side-name player1">💀 Player 1</p>
                <div id="diceBox1" class="dice-box">-</div>
            </div>
            <div id="board" class="board"></div>
            <div class="side">
                <p class="side-name player2">Player 2 😎</p>
                <div id="diceBox2" class="dice-box">-</div>
            </div>
        </div>
        <div class="controls">
            <button id="rollBtn">🎲 Roll Dice</button>
            <button id="resetBtn">🔄 Restart</button>
        </div>
        <p id="status"></p>
        <p id="message"></p>
    </main>
    <div id="winnerOverlay" class="winner-overlay hidden">
        <div class="winner-card">
            <h2 id="winnerName"></h2>
            <button id="closeWinnerBtn">🎉 Play Again</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
